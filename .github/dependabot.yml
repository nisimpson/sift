      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
      - "exprlang"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Update jsonapi adapter dependencies
  - package-ecosystem: "gomod"
    directory: "/thru/jsonapi"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
      - "jsonapi"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
