name: Publish Check

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  check:
    name: Pre-publish Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Run publish check
      run: make publish-check

    - name: Verify go.mod files
      run: |
        echo "Checking all go.mod files are tidy..."
        for mod in $(find . -name "go.mod"); do
          dir=$(dirname "$mod")
          echo "Checking $dir..."
          cd "$dir"
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "❌ $dir/go.mod is not tidy"
            git diff go.mod go.sum
            exit 1
          fi
          cd - > /dev/null
        done
        echo "✅ All go.mod files are tidy"

    - name: Check for breaking changes
      run: |
        echo "Checking for potential breaking changes..."
        # This is a placeholder - you could integrate tools like gorelease
        echo "Warning: Manual review required for breaking changes"

    - name: Comment on PR
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const emoji = status === 'success' ? '✅' : '❌';
          const message = status === 'success' 
            ? 'All publish checks passed! This PR is ready to merge and release.'
            : 'Some publish checks failed. Please review the logs.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `${emoji} **Publish Check ${status}**\n\n${message}`
          });
