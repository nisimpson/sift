name: Publish Check

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    name: Pre-publish Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.7'
        cache: true

    - name: Run publish check
      run: make publish-check

    - name: Comment on PR
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const prefix = status === 'success' ? '✅' : '❌';
          const message = status === 'success' 
            ? 'All publish checks passed! This PR is ready to merge and release.'
            : 'Some publish checks failed. Please review the logs.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `${prefix} **Publish Check ${status}**\n\n${message}`
          });
