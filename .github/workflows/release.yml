name: Release

on:
  push:
    tags:
      - 'v*'
      - 'thru/*/v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Determine module and version
      id: module_info
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        
        if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          # Main module tag (e.g., v1.0.0)
          echo "module=main" >> $GITHUB_OUTPUT
          echo "module_path=." >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "release_name=Sift $TAG" >> $GITHUB_OUTPUT
        elif [[ "$TAG" =~ ^(thru/[^/]+)/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
          # Submodule tag (e.g., thru/sql/v1.0.0)
          MODULE_PATH="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          MODULE_NAME=$(echo "$MODULE_PATH" | sed 's/thru\///')
          echo "module=$MODULE_NAME" >> $GITHUB_OUTPUT
          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_name=Sift ${MODULE_NAME^} v$VERSION" >> $GITHUB_OUTPUT
        else
          echo "Invalid tag format: $TAG"
          exit 1
        fi

    - name: Run tests
      run: make test-short

    - name: Generate changelog
      id: changelog
      run: |
        # Get previous tag for this module
        MODULE_PATH="${{ steps.module_info.outputs.module_path }}"
        TAG="${{ steps.module_info.outputs.tag }}"
        
        if [ "$MODULE_PATH" = "." ]; then
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "$TAG" | head -n1)
        else
          PREV_TAG=$(git tag -l "${MODULE_PATH}/v*" --sort=-v:refname | grep -v "$TAG" | head -n1)
        fi
        
        echo "Previous tag: $PREV_TAG"
        
        if [ -z "$PREV_TAG" ]; then
          echo "changelog=Initial release" >> $GITHUB_OUTPUT
        else
          # Generate changelog from commits
          if [ "$MODULE_PATH" = "." ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..$TAG" -- . ':!thru/')
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..$TAG" -- "$MODULE_PATH/")
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changes in this module"
          fi
          
          # Save to file to handle multiline
          echo "$CHANGELOG" > /tmp/changelog.txt
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.module_info.outputs.tag }}
        release_name: ${{ steps.module_info.outputs.release_name }}
        body: |
          ## ${{ steps.module_info.outputs.release_name }}
          
          **Module**: `github.com/nisimpson/sift/${{ steps.module_info.outputs.module_path }}`
          **Version**: `${{ steps.module_info.outputs.version }}`
          
          ### Installation
          
          ```bash
          go get github.com/nisimpson/sift/${{ steps.module_info.outputs.module_path }}@${{ steps.module_info.outputs.tag }}
          ```
          
          ### Changes
          
          ${{ steps.changelog.outputs.changelog }}
          
          ### Documentation
          
          - [pkg.go.dev](https://pkg.go.dev/github.com/nisimpson/sift/${{ steps.module_info.outputs.module_path }}@${{ steps.module_info.outputs.tag }})
          - [GitHub](https://github.com/nisimpson/sift/tree/${{ steps.module_info.outputs.tag }}/${{ steps.module_info.outputs.module_path }})
        draft: false
        prerelease: false

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: release
    if: success()
    
    steps:
    - name: Notify success
      run: |
        echo "✅ Release created successfully for ${{ github.ref }}"
