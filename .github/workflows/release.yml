name: Release

on:
  push:
    tags:
      - 'v*'
      - 'thru/*/v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Extract release information
      id: release_info
      run: ./scripts/release-info.sh

    - name: Run tests
      run: make test-short

    - name: Generate changelog
      id: changelog
      run: |
        CHANGELOG=$(./scripts/generate-changelog.sh "${{ steps.release_info.outputs.tag }}" "${{ steps.release_info.outputs.module_path }}")
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ steps.release_info.outputs.release_name }}
        body: |
          ## ${{ steps.release_info.outputs.release_name }}
          
          **Module**: `github.com/nisimpson/sift/${{ steps.release_info.outputs.module_path }}`
          **Version**: `${{ steps.release_info.outputs.version }}`
          
          ### Installation
          
          ```bash
          go get github.com/nisimpson/sift/${{ steps.release_info.outputs.module_path }}@${{ steps.release_info.outputs.tag }}
          ```
          
          ### Changes
          
          ${{ steps.changelog.outputs.changelog }}
          
          ### Documentation
          
          - [pkg.go.dev](https://pkg.go.dev/github.com/nisimpson/sift/${{ steps.release_info.outputs.module_path }}@${{ steps.release_info.outputs.tag }})
          - [GitHub](https://github.com/nisimpson/sift/tree/${{ steps.release_info.outputs.tag }}/${{ steps.release_info.outputs.module_path }})
        draft: false
        prerelease: false
